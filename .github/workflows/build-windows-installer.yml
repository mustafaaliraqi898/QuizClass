name: Build QuizClass Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/electron-installer-latest'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run lint
      - name: Build Windows installer
        run: npm run electron:build
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizClass-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
